[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surecom-ui"
version = "0.2.1"
description = "Shared design system and base templates for Surecom internal Django apps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.0",
]

[project.optional-dependencies]
# Microsoft 365 sign-in (surecom_ui.auth)
auth = [
    "django-allauth[socialaccount]>=65.11,<66",
]

[tool.setuptools.packages.find]
include = ["surecom_ui*"]

[tool.setuptools.package-data]
surecom_ui = [
    "templates/**/*.html",
    "static/**/*.css",
    "icons/*.svg",
]
"surecom_ui.auth" = [
    "templates/**/*.html",
]
