[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surecom-ui"
version = "0.1.1"
description = "Shared design system and base templates for Surecom internal Django apps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.0",
]

[tool.setuptools.packages.find]
include = ["surecom_ui*"]

[tool.setuptools.package-data]
surecom_ui = [
    "templates/**/*.html",
    "static/**/*.css",
    "icons/*.svg",
]
